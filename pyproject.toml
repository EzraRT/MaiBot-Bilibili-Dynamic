[project]
name = "maibot-bilibili-dynamic"
version = "0.1.0"
description = "MaiBot Bilibili subscriptions, low-latency polling and link cards"
readme = "README.md"
authors = [{ name = "EzraRT" }]
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "maibot-plugin-sdk>=2.11,<3",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "qrcode>=8,<9",
    "regex>=2024.11",
]

[project.urls]
Repository = "https://github.com/EzraRT/MaiBot-Bilibili-Dynamic"
Documentation = "https://github.com/EzraRT/MaiBot-Bilibili-Dynamic/blob/main/README.md"
Issues = "https://github.com/EzraRT/MaiBot-Bilibili-Dynamic/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
